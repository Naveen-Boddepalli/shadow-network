name: Render Deployments

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ai-engine/**'
      - '.github/workflows/render-deployments.yml'
      - 'render.yaml'
  # Run the tests on pull requests too; deploys only happen on pushes to main.
  pull_request:
    paths:
      - 'backend/**'
      - 'ai-engine/**'
      - '.github/workflows/render-deployments.yml'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai_engine: ${{ steps.filter.outputs.ai_engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/render-deployments.yml'
              - 'render.yaml'
            ai_engine:
              - 'ai-engine/**'
              - '.github/workflows/render-deployments.yml'
              - 'render.yaml'

  test-backend:
    name: Test Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  test-ai-engine:
    name: Test AI Engine
    needs: changes
    if: ${{ needs.changes.outputs.ai_engine == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-engine/requirements-dev.txt
      # Tests stub the ML models, so torch/transformers aren't needed here
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  deploy-backend:
    name: Deploy Backend
    needs: test-backend
    # Skipped automatically when backend tests were skipped or failed
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.4.4
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clear_cache: false
          wait_deploy: true
          github_deployment: true
          deployment_environment: production

  deploy-ai-engine:
    name: Deploy AI Engine
    needs: [test-ai-engine, deploy-backend]
    # Only needs passing AI tests. It runs after the backend deploy so the two
    # free-tier builds don't overlap, but a failed backend deploy doesn't block it.
    if: ${{ always() && github.event_name == 'push' && needs.test-ai-engine.result == 'success' && needs.deploy-backend.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.4.4
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID_AI }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clear_cache: false
          wait_deploy: true
          github_deployment: true
          deployment_environment: production
